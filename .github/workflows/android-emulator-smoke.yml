name: Android Emulator Smoke

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-emulator-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    name: Android 15 emulator integration
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start emulator and verify native screens and persistence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          working-directory: android
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.haebi.subtitle.MicrophoneActivityDeviceTest,com.haebi.subtitle.SecretStoreDeviceTest,com.haebi.subtitle.ResumeAdmissionDeviceTest
            adb shell am start -n com.haebi.subtitle/.MainActivity
            sleep 5
            mkdir -p ../output
            adb exec-out screencap -p > ../output/subtitle-emulator-home.png
      - name: Upload emulator screenshot and device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-emulator-integration
          path: |
            output/subtitle-emulator-home.png
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          if-no-files-found: warn
