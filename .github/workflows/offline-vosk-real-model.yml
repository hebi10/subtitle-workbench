name: Offline Vosk real model integration

on:
  pull_request:
    paths:
      - 'android/app/src/androidTest/java/com/haebi/subtitle/OfflineVoskRealModelDeviceTest.java'
      - '.github/workflows/offline-vosk-real-model.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-vosk-real-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-device-test:
    name: Verified Vosk model and real WAV on Android 15
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real English model download and offline speech transcription
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          working-directory: android
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -partition-size 2048 -memory 4096
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.haebi.subtitle.OfflineVoskRealModelDeviceTest
      - name: Upload real-model test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-vosk-real-model-android15
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          retention-days: 7
          if-no-files-found: warn
