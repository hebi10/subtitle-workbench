name: Play exact-source verification

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Release web, Publisher and Android checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Node and release automation unit tests
        run: |
          npm test
          python3 -m unittest discover -s scripts/release/tests -v
      - name: Review relay server tests without paid API calls
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci --prefix server/review-relay
          npm test --prefix server/review-relay
      - name: Install Playwright and run WebView UI regressions
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node --test android/tests/*.test.mjs
      - name: Install SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Android unit tests, lint and instrumentation build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

  emulator:
    name: Release Android 15 device checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Native screen, offline recognition, secrets and resume tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          working-directory: android
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            chmod +x gradlew
            ./gradlew connectedDebugAndroidTest --no-daemon -Pandroid.testInstrumentationRunnerArguments.class=com.haebi.subtitle.EditorialComponentsDeviceTest,com.haebi.subtitle.EditorialNativeScreensDeviceTest,com.haebi.subtitle.MicrophoneActivityDeviceTest,com.haebi.subtitle.OfflineVoskDeviceTest,com.haebi.subtitle.SecretStoreDeviceTest,com.haebi.subtitle.PreparedJobDeviceTest,com.haebi.subtitle.ResumeAdmissionDeviceTest
      - name: Preserve device verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-device-verification-${{ github.run_id }}
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
          retention-days: 7
          if-no-files-found: warn
