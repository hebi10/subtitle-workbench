name: Play internal release

on:
  workflow_run:
    workflows: ["Verify web and Android"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'check, audit (read-only), build, deploy, or promote existing internal version'
        required: true
        type: choice
        default: check
        options: [check, audit, build, deploy, promote]
      version_code:
        description: 'Existing internal versionCode for promote; build-only versionCode otherwise'
        required: false
        type: string
        default: '11'
      release_status:
        description: 'completed = active internal; draft = draft release after Console bootstrap'
        type: choice
        default: completed
        options: [completed, draft]
      changes_not_sent_for_review:
        description: 'Keep committed changes pending explicit Console review submission'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-com-haebi-subtitle
  cancel-in-progress: false

jobs:
  source:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      mode: ${{ steps.route.outputs.mode }}
      target: ${{ steps.route.outputs.target }}
      promotion_code: ${{ steps.route.outputs.promotion_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require main source and completed required CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/source.py
      - name: Route strictly marked STORE-04 read-only audit through the trusted workflow
        id: route
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EVENT_TYPE: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          PROMOTE_VERSION_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          title="$(git log -1 --format=%s "$SOURCE_SHA")"
          if [[ "$EVENT_TYPE" == 'workflow_run' && "$title" == 'qa: STORE-04 read-only Play listing audit [audit-only]' ]]; then
            echo 'mode=audit' >> "$GITHUB_OUTPUT"
            echo 'target=none' >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_TYPE" == 'workflow_run' && "$title" == 'store: RELEASE-01-FIX approved brand and description [listing-reconcile]' ]]; then
            echo 'mode=reconcile' >> "$GITHUB_OUTPUT"
            echo 'target=none' >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_TYPE" == 'workflow_run' && "$title" == 'store: STORE-05 trusted screenshot registration [listing-only]' ]]; then
            echo 'mode=listing' >> "$GITHUB_OUTPUT"
            echo 'target=none' >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_TYPE" == 'workflow_run' && "$title" == 'store: STORE-03 trusted screenshot registration [listing-only]' ]]; then
            echo 'mode=listing' >> "$GITHUB_OUTPUT"
            echo 'target=none' >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_TYPE" == 'workflow_run' && "$title" == 'store: Editorial Studio 5-B trusted screenshot registration' ]]; then
            echo 'mode=listing' >> "$GITHUB_OUTPUT"
            echo 'target=none' >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_TYPE" == 'workflow_run' ]]; then
            if [[ "$title" == 'fix(play): resume existing internal 21 to closed [promote-existing-21]' ]]; then
              echo 'mode=promote' >> "$GITHUB_OUTPUT"
              echo 'target=alpha' >> "$GITHUB_OUTPUT"
              echo 'promotion_code=21' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$title" == *'[skip-play]'* ]]; then
              echo 'mode=check' >> "$GITHUB_OUTPUT"
              echo 'target=none' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$title" == *'[deploy-internal]'* && "$title" == *'[deploy-closed]'* ]]; then
              echo 'Conflicting Play target markers' >&2
              exit 1
            fi
            echo 'mode=deploy' >> "$GITHUB_OUTPUT"
            if [[ "$title" == *'[deploy-closed]'* ]]; then
              echo 'target=alpha' >> "$GITHUB_OUTPUT"
            else
              echo 'target=internal' >> "$GITHUB_OUTPUT"
            fi
          else
            case "$REQUESTED_MODE" in
              check|build|deploy) echo "mode=$REQUESTED_MODE" >> "$GITHUB_OUTPUT"; echo 'target=internal' >> "$GITHUB_OUTPUT" ;;
              audit) echo 'mode=audit' >> "$GITHUB_OUTPUT"; echo 'target=none' >> "$GITHUB_OUTPUT" ;;
              promote)
                if [[ ! "$PROMOTE_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
                  echo 'An exact existing internal versionCode is required for promote' >&2
                  exit 1
                fi
                echo 'mode=promote' >> "$GITHUB_OUTPUT"
                echo 'target=alpha' >> "$GITHUB_OUTPUT"
                echo "promotion_code=$PROMOTE_VERSION_CODE" >> "$GITHUB_OUTPUT" ;;
              *) echo 'Unsupported release mode' >&2; exit 1 ;;
            esac
          fi

  gates:
    needs: source
    uses: ./.github/workflows/play-gates.yml
    with:
      source_sha: ${{ needs.source.outputs.sha }}

  release:
    needs: [source, gates]
    if: needs.source.outputs.mode != 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play
    permissions:
      contents: read
      id-token: write
    env:
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reject source superseded while verification was running
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/release/source.py --assert-current "$SOURCE_SHA"
      - name: Verify original upload key and prepare private signing file
        if: needs.source.outputs.mode == 'build' || needs.source.outputs.mode == 'deploy'
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 scripts/release/preflight.py signing
      - name: Check Play authentication configuration
        id: credentials
        if: needs.source.outputs.mode == 'deploy' || needs.source.outputs.mode == 'listing' || needs.source.outputs.mode == 'reconcile' || needs.source.outputs.mode == 'promote' || needs.source.outputs.mode == 'audit'
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/release/preflight.py auth
      - name: Authenticate with Workload Identity Federation
        id: wif
        if: (needs.source.outputs.mode == 'deploy' || needs.source.outputs.mode == 'listing' || needs.source.outputs.mode == 'reconcile' || needs.source.outputs.mode == 'promote' || needs.source.outputs.mode == 'audit') && steps.credentials.outputs.auth_mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Authenticate with legacy service-account JSON
        id: json
        if: (needs.source.outputs.mode == 'deploy' || needs.source.outputs.mode == 'listing' || needs.source.outputs.mode == 'reconcile' || needs.source.outputs.mode == 'promote' || needs.source.outputs.mode == 'audit') && steps.credentials.outputs.auth_mode == 'json'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Allocate version above all uploaded bundles, APKs and tracks
        id: version
        if: needs.source.outputs.mode == 'deploy'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
        run: python3 scripts/release/publisher.py --report output/play-allocation.json allocate
      - name: Install SDK 36
        if: needs.source.outputs.mode == 'build' || needs.source.outputs.mode == 'deploy'
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build signed release with the allocated versionCode
        if: needs.source.outputs.mode == 'build' || needs.source.outputs.mode == 'deploy'
        working-directory: android
        env:
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code || inputs.version_code || '11' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease
      - name: Verify AAB signature against original upload certificate
        if: needs.source.outputs.mode == 'build' || needs.source.outputs.mode == 'deploy'
        run: python3 scripts/release/preflight.py verify-bundle --bundle android/app/build/outputs/bundle/release/app-release.aab
      - name: Preserve signed AAB
        if: needs.source.outputs.mode == 'build' || needs.source.outputs.mode == 'deploy'
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-signed-aab-${{ steps.version.outputs.version_code || inputs.version_code || '11' }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: Reject stale source immediately before upload
        if: needs.source.outputs.mode == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/release/source.py --assert-current "$SOURCE_SHA"
      - name: Submit internal release and require fresh Play API readback
        if: needs.source.outputs.mode == 'deploy'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          RELEASE_STATUS: ${{ inputs.release_status || 'completed' }}
          KEEP_FOR_REVIEW: ${{ inputs.changes_not_sent_for_review || false }}
        shell: bash
        run: |
          args=()
          if [[ "$KEEP_FOR_REVIEW" == 'true' ]]; then args+=(--changes-not-sent-for-review); fi
          python3 scripts/release/publisher.py --report output/play-release.json deploy --bundle android/app/build/outputs/bundle/release/app-release.aab --version-code "$VERSION_CODE" --status "$RELEASE_STATUS" "${args[@]}"
      - name: Promote verified internal version to closed alpha on explicit release marker
        if: (needs.source.outputs.mode == 'deploy' && needs.source.outputs.target == 'alpha') || needs.source.outputs.mode == 'promote'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
          VERSION_CODE: ${{ needs.source.outputs.mode == 'promote' && needs.source.outputs.promotion_code || steps.version.outputs.version_code }}
        run: python3 scripts/release/publisher.py --report output/play-promotion.json promote --version-code "$VERSION_CODE" --track alpha
      - name: Verify STORE-03 image count and file SHA-256 before submission
        if: needs.source.outputs.mode == 'listing'
        run: |
          python3 scripts/release/listing.py check --phone-only --require-eight-screenshots --report output/play-listing-check.json
          node --test android/tests/editorial-5b-store-assets.test.mjs
      - name: Reject superseded main before image update
        if: needs.source.outputs.mode == 'listing'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/release/source.py --assert-current "$SOURCE_SHA"
      - name: Submit only STORE-03 eight phone screenshots and check fresh Play hashes
        if: needs.source.outputs.mode == 'listing'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
        run: python3 scripts/release/listing.py apply --phone-only --require-eight-screenshots --send-for-review --report output/play-listing-store03.json
      - name: Validate RELEASE-01-FIX approved brand, description and STORE-05 screenshots
        if: needs.source.outputs.mode == 'reconcile'
        run: |
          python3 scripts/release/listing.py check --reconcile-brand --require-eight-screenshots --report output/play-listing-reconcile-check.json
          python3 -m unittest discover -s scripts/release/tests -p test_listing.py -v
      - name: Reject superseded main before approved listing reconciliation
        if: needs.source.outputs.mode == 'reconcile'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/release/source.py --assert-current "$SOURCE_SHA"
      - name: Reconcile only approved full description, icon and feature graphic
        if: needs.source.outputs.mode == 'reconcile'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
        run: python3 scripts/release/listing.py apply --reconcile-brand --require-eight-screenshots --send-for-review --report output/play-listing-reconcile.json
      - name: Confirm current main before STORE-04 read-only Play audit
        if: needs.source.outputs.mode == 'audit'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/release/source.py --assert-current "$SOURCE_SHA"
      - name: Read Play listing image hashes and test tracks without committing an edit
        if: needs.source.outputs.mode == 'audit'
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/release/store_audit.py --report output/play-store-audit.json --internal-version-code 22
      - name: Preserve non-secret release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-internal-report-${{ github.run_id }}
          path: output/play-*.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Remove private signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/subtitle-upload-keystore.jks"

  checked:
    needs: [source, gates]
    if: needs.source.outputs.mode == 'check'
    runs-on: ubuntu-latest
    steps:
      - name: Report verification without deployment
        run: echo 'Exact-source CI and Android device checks passed. Mode check does not build a signed bundle or submit to Play.' >> "$GITHUB_STEP_SUMMARY"
