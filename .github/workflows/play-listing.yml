name: Play Korean store listing

on:
  workflow_dispatch:
    inputs:
      ops01_release_approved:
        description: 'Explicit approval for Play mutation after final QA'
        required: true
        type: boolean
        default: false
      mode:
        description: 'check = local validation only; apply = replace reviewed Korean listing and explicit image categories'
        type: choice
        default: check
        options: [check, apply]
        required: true
      send_for_review:
        description: 'Send committed changes for review instead of keeping them pending in Console'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-com-haebi-subtitle
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require main source and completed required CI
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/source.py
      - name: Validate reviewed listing and image inputs
        run: python3 scripts/release/listing.py check

  apply:
    needs: source
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.ops01_release_approved == true &&
      (inputs.mode == 'apply')
    runs-on: ubuntu-latest
    environment: google-play
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - name: Check Play authentication configuration
        id: credentials
        env:
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/release/preflight.py auth
      - name: Authenticate with Workload Identity Federation
        id: wif
        if: steps.credentials.outputs.auth_mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Authenticate with legacy service-account JSON
        id: json
        if: steps.credentials.outputs.auth_mode == 'json'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
      - name: Reject source superseded during verification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: python3 scripts/release/source.py --assert-current "$SOURCE_SHA"
      - name: Submit listing and require fresh text and image hash readback
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.wif.outputs.access_token || steps.json.outputs.access_token }}
          SEND_FOR_REVIEW: ${{ inputs.send_for_review }}
        shell: bash
        run: |
          args=()
          if [[ "$SEND_FOR_REVIEW" == 'true' ]]; then args+=(--send-for-review); fi
          python3 scripts/release/listing.py apply --report output/play-listing.json "${args[@]}"
      - name: Preserve non-secret listing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-listing-report-${{ github.run_id }}
          path: output/play-listing.json
          if-no-files-found: ignore
          retention-days: 30
