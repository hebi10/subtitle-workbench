name: SW-FIX-10 store assets review from final Android QA

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact frozen final main SHA
        type: string
        required: true
      capture_run_id:
        description: Successful main Android Emulator Smoke run ID for the same SHA
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  review-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify frozen main and exact successful real Android QA run
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_REPOSITORY" == "hebi10/subtitle-workbench" ]]
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$CAPTURE_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CAPTURE_RUN_ID" > "$RUNNER_TEMP/sw-capture-run.json"
          jq -e --arg sha "$EXPECTED_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_branch == "main" and .event == "workflow_dispatch"
            and .status == "completed" and .conclusion == "success"
            and .path == ".github/workflows/android-emulator-smoke.yml"
            and .head_repository.full_name == $repo
          ' "$RUNNER_TEMP/sw-capture-run.json" >/dev/null
          gh run download "$CAPTURE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name subtitle-emulator-integration --dir "$RUNNER_TEMP/sw-android-captures"
      - name: Install compositor dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
          test -f /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf
      - name: Compose eight real Android screenshots without replacing tracked assets
        env:
          EXPECTED_SHA: ${{ inputs.expected_main_sha }}
          CAPTURE_RUN_ID: ${{ inputs.capture_run_id }}
        run: |
          set -euo pipefail
          python3 scripts/ui10i/build_store_assets.py \
            --capture-dir "$RUNNER_TEMP/sw-android-captures" \
            --main-sha "$EXPECTED_SHA" --source-sha "$EXPECTED_SHA" \
            --source-run-id "$CAPTURE_RUN_ID" \
            --font /usr/share/fonts/truetype/nanum/NanumGothicBold.ttf \
            --out output/sw-fix-10-store-assets
          python3 scripts/release/ui10i_preflight.py \
            --assets-dir output/sw-fix-10-store-assets \
            --capture-sha "$EXPECTED_SHA" --require-assets-ready \
            > output/sw-fix-10-store-assets/preflight.json
          git diff --exit-code -- assets/play-store assets/brand
      - name: Recheck unchanged main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]]
      - name: Preserve review-only images and provenance
        uses: actions/upload-artifact@v4
        with:
          name: sw-fix-10-store-assets-review
          path: output/sw-fix-10-store-assets/
          if-no-files-found: error
          retention-days: 30
