name: UI-10-I build verified Android store artwork
on:
  push:
    branches: [release/ui10i-offline-readiness-20261114]
    paths:
      - 'scripts/ui10i/build_store_assets.py'
      - '.github/workflows/ui10i-store-artwork.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: ui10i-store-artwork
  cancel-in-progress: false
jobs:
  assets:
    name: Generate review-only real Android images
    if: github.repository == 'hebi10/subtitle-workbench' && github.ref == 'refs/heads/release/ui10i-offline-readiness-20261114'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify source capture and current main contain identical app UI bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          original=b57afccc2850f35cb675a837ff0d5437edad0936
          actual="$(gh api repos/$GITHUB_REPOSITORY/actions/runs/43562836588 --jq '.head_sha')"
          test "$actual" = "$original"
          git fetch origin main
          git fetch origin "$original"
          main_sha="$(git rev-parse origin/main)"
          git diff --exit-code "$original" "$main_sha" -- android/app/src/main android/web src index.html
          printf 'MAIN_SHA=%s\n' "$main_sha" >> "$GITHUB_ENV"
          echo "Exact original Android UI equivalent to main: $main_sha" >> "$GITHUB_STEP_SUMMARY"
      - name: Download actual Android API35 screenshots from source run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/ui10i-captures
          gh run download 43562836588 --repo "$GITHUB_REPOSITORY" --name subtitle-emulator-integration --dir /tmp/ui10i-captures
          test -f /tmp/ui10i-captures/output/editorial-5a/webview-light-font100/video-light-font100.png
      - name: Install pinned raster dependency and Korean font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          python3 -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Create eight uncropped Android screenshot layouts and brand artwork
        run: |
          python3 scripts/ui10i/build_store_assets.py --capture-dir /tmp/ui10i-captures --main-sha "$MAIN_SHA"
          python3 scripts/release/ui10i_preflight.py --capture-sha "$MAIN_SHA" --require-assets-ready
          python3 -m unittest scripts.release.tests.test_ui10i_preflight -v
      - name: Commit only images and reproducible manifest to review branch
        shell: bash
        run: |
          set -euo pipefail
          git add assets/play-store/ko-KR/*.png assets/play-store/ko-KR/manifest.json assets/play-store/ko-KR/capture-provenance-ui10.json
          if git diff --cached --quiet; then
            echo "All image assets already match" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "store: UI-10-I actual Android screenshots and 자막라인 art [skip-play]"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "Images committed to review branch only; Google Play unchanged." >> "$GITHUB_STEP_SUMMARY"
      - name: Save reviewable store images and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui10i-jamakline-store-review
          path: |
            assets/play-store/ko-KR/*.png
            assets/play-store/ko-KR/manifest.json
            assets/play-store/ko-KR/capture-provenance-ui10.json
          retention-days: 30
          if-no-files-found: warn
