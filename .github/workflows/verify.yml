name: Verify web and Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web unit and UI tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Web unit tests
        run: npm test
      - name: Review relay server tests without paid API calls
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm ci --prefix server/review-relay
          npm test --prefix server/review-relay
      - name: Build relay container and verify isolated startup
        run: |
          docker build -t subtitle-review-relay:ci server/review-relay
          docker compose --env-file server/review-relay/.env.example -f server/review-relay/compose.yml config --quiet
          docker run -d --name subtitle-relay-ci --network none --read-only --tmpfs /data:uid=1000,gid=1000,mode=0700 --tmpfs /tmp -e REVIEW_RELAY_ENABLED=true -e REVIEW_ACCESS_CODE=fixture_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa -e OPENAI_API_KEY=sk-fixture_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa subtitle-review-relay:ci
          trap 'docker rm -f subtitle-relay-ci >/dev/null 2>&1 || true' EXIT
          for attempt in 1 2 3 4 5; do
            if docker exec subtitle-relay-ci node --input-type=module -e 'const r = await fetch("http://127.0.0.1:8080/v1/models/whisper-1"); process.exit(r.status === 401 ? 0 : 1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Play release automation unit tests
        run: python3 -m unittest discover -s scripts/release/tests -v
      - name: Install Playwright for WebView UI regressions
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: WebView UI regression tests
        env:
          PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright
        run: node --test android/tests/*.test.mjs
      - name: Upload redesigned web and Android screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-workbench-v08-design-screens
          path: |
            output/redesign-web/*.png
            output/redesign-android/*.png
            output/review-relay-ui/*.png
            output/editorial-theme/*.png
            output/editorial-components/*.png
            output/editorial-3a/*.png
            output/editorial-3b/*.png
            output/editorial-4a/*.png
            output/editorial-5a/*.png
            output/editorial-5a/*.json
          retention-days: 14
          if-no-files-found: warn

  android:
    name: Android unit, lint and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;35.0.0'
      - name: Gradle verification and debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: subtitle-workbench-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
