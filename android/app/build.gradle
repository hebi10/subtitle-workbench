plugins { id 'com.android.application' }

android {
    namespace 'com.haebi.subtitle'
    compileSdk 35
    defaultConfig {
        applicationId 'com.haebi.subtitle'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/webAssets'))
    testOptions { unitTests.returnDefaultValues = true }
}

tasks.register('syncWebAssets', Sync) {
    from('../web') { include 'index.html', 'app.js', 'styles.css'; into 'web' }
    from('../../src') {
        include 'core.js', 'subtitle-editor.js', 'subtitle-player.js', 'edit-history.js'
        into 'shared'
    }
    into layout.buildDirectory.dir('generated/webAssets')
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-transformer:1.6.1'
    implementation 'androidx.media3:media3-effect:1.6.1'
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
}
